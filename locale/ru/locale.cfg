[mod-name]
gleba-cold-storage=Холодильники Глебы

[mod-description]
gleba-cold-storage=Три уровня охлаждения, которые замедляют порчу, не убирая челлендж.

[entity-name]
gcs-cold-chamber=Холодильная камера
gcs-cold-chamber-cooler=Охлаждение камеры
gcs-cryo-vault=Криохранилище
gcs-cryo-vault-passive-provider=Пассивное криохранилище-поставщик
gcs-cryo-vault-requester=Криохранилище-запросчик
gcs-cryo-vault-buffer=Буферное криохранилище
gcs-cryo-vault-cooler=Охлаждение криохранилища
gcs-refrigerated-wagon=Вагон-рефрижератор
gcs-cryo-encapsulator=Криокапсулятор

[entity-description]
gcs-cold-chamber=Охлаждает содержимое примерно до 0 °C (порча примерно в 3× медленнее), пока есть энергия (250 кВт) и вода (6/с). Вода входит с севера и запада, пар 100 °C (6/с) выходит на юг и восток — его можно пустить в паровой двигатель (~100 кВт). Если пару некуда деться, охлаждение встаёт. На жарких планетах так не охладит; на Аквило холод бесплатный. Без охлаждения медленно нагревается до температуры планеты.
gcs-cryo-vault=Охлаждает содержимое примерно до −35 °C (порча примерно в 20× медленнее), пока есть энергия (300 кВт) и криоячейки внутри. Ячейки заряжаются только на Аквило и оттаивают за час. На Аквило хранилище холодное бесплатно.
gcs-cryo-vault-passive-provider=__ENTITY__gcs-cryo-vault__, отдающее содержимое в логистическую сеть. Охлаждается так же.
gcs-cryo-vault-requester=__ENTITY__gcs-cryo-vault__, запрашивающее предметы из логистической сети. Охлаждается так же.
gcs-cryo-vault-buffer=__ENTITY__gcs-cryo-vault__, буферизующее предметы для логистической сети. Охлаждается так же.
gcs-refrigerated-wagon=Замедляет порчу груза, пока сетка оборудования даёт 150 кВт. Поставьте в сетку генератор или аккумуляторы.
gcs-cryo-encapsulator=Замораживает воду в лёд и запечатывает портящиеся продукты в ледяные блоки, которые хранятся гораздо дольше. Модули и маяки не принимает.

[item-name]
gcs-cryo-cell=Криоячейка
gcs-empty-cryo-cell=Пустая криоячейка
gcs-frozen=__1__ во льду

[item-description]
gcs-cryo-cell=Замороженный хладагент для криохранилища: положите его внутрь хранилища. Заряжается только на Аквило, оттаивает в пустую ячейку за час. Подтаявшая ячейка холодит меньше.
gcs-empty-cryo-cell=Перезарядите её на Аквило.
gcs-frozen=__1__ × __2__ во льду. Хранится гораздо дольше свежего; разморозьте в криокапсуляторе.

[recipe-name]
gcs-freeze=Заморозить: __1__
gcs-thaw=Разморозить: __1__
gcs-freeze-water=Заморозить воду

[technology-name]
gcs-cold-chamber=Холодовая цепь
gcs-cryo-vault=Криогенное хранение
gcs-cryo-encapsulation=Криокапсуляция

[technology-description]
gcs-cold-chamber=Камера с питанием и водяным охлаждением, замедляющая порчу содержимого.
gcs-cryo-vault=Глубокозамороженные хранилища, их логистические версии и вагон-рефрижератор.
gcs-cryo-encapsulation=Запечатывайте продукты в лёд, чтобы возить их между планетами.

[equipment-grid-name]
gcs-wagon-grid=Питание рефрижератора

