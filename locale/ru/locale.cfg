[mod-setting-description]
gcs-preserve-science=Разрешить хранить в холоде и замораживать научные пакеты. По умолчанию выключено: держать агронауку свежей — часть челленджа Глебы.
gcs-frozen-multiplier=Во сколько раз дольше хранится ледяной блок по сравнению со свежим продуктом.
gcs-chamber-slowdown=Во сколько раз максимум замедляется порча в холодильной камере, как бы холодно в ней ни было.
gcs-vault-slowdown=Во сколько раз максимум замедляется порча в криохранилище, как бы холодно в нём ни было.
gcs-wagon-slowdown=Во сколько раз максимум замедляется порча в вагоне-рефрижераторе, как бы холодно в нём ни было.
gcs-cell-minutes=Сколько минут одна полностью замороженная криоячейка держит холод в хранилище. Подтаявшая ячейка работает пропорционально меньше.
gcs-update-period=Как часто обходится каждый холодильник. Меньше — точнее, больше — легче для UPS.
