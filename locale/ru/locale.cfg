[mod-setting-name]
gcs-preserve-science=Сохранять научные пакеты
gcs-frozen-multiplier=Множитель срока хранения во льду
gcs-chamber-slowdown=Максимальное замедление в холодильной камере
gcs-vault-slowdown=Максимальное замедление в криохранилище
gcs-wagon-slowdown=Максимальное замедление в вагоне-рефрижераторе
gcs-cell-minutes=Время работы криоячейки (минуты)
