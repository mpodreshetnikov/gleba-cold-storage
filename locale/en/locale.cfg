[mod-setting-name]
gcs-preserve-science=Preserve science packs
gcs-frozen-multiplier=Frozen item shelf life multiplier
gcs-chamber-slowdown=Cold chamber maximum slowdown
gcs-vault-slowdown=Cryo vault maximum slowdown
gcs-wagon-slowdown=Refrigerated wagon maximum slowdown
gcs-cell-minutes=Cryo cell duration (minutes)
gcs-update-period=Update period (ticks)

[mod-setting-description]
gcs-preserve-science=Let cold storage and freezing work on science packs. Off by default: keeping agricultural science fresh is part of Gleba's challenge.
gcs-frozen-multiplier=How many times longer a frozen block keeps than the fresh item.
gcs-chamber-slowdown=Upper limit on how many times slower items spoil in a cold chamber, however cold it gets.
gcs-vault-slowdown=Upper limit on how many times slower items spoil in a cryo vault, however cold it gets.
gcs-wagon-slowdown=Upper limit on how many times slower items spoil in a refrigerated wagon, however cold it gets.
gcs-cell-minutes=How long one fully frozen cryo cell keeps a vault cold. A partly thawed cell lasts proportionally less.
gcs-update-period=How often each cold container is visited. Lower is more precise, higher is lighter on UPS.
