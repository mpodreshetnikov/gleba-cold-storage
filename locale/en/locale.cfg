[mod-name]
gleba-cold-storage=Gleba Cold Storage

[mod-description]
gleba-cold-storage=Three tiers of refrigeration that slow spoilage without removing the challenge.

[entity-name]
gcs-cold-chamber=Cold chamber
gcs-cold-chamber-cooler=Cold chamber cooling
gcs-cryo-vault=Cryo vault
gcs-cryo-vault-passive-provider=Passive provider cryo vault
gcs-cryo-vault-requester=Requester cryo vault
gcs-cryo-vault-buffer=Buffer cryo vault
gcs-cryo-vault-cooler=Cryo vault cooling
gcs-refrigerated-wagon=Refrigerated wagon
gcs-cryo-encapsulator=Cryo-encapsulator

[entity-description]
gcs-cold-chamber=Cools its contents to about 0 °C (spoilage about 3× slower) while it has power (250 kW) and water (6/s). Water enters on the north and west; 100 °C steam (6/s) leaves on the south and east and can drive a steam engine (~100 kW). If the steam has nowhere to go, cooling stops. On hot planets it cannot get as cold; on Aquilo it is cold for free. Without cooling it slowly warms to the planet's temperature.
gcs-cryo-vault=Cools its contents to about -35 °C (spoilage about 20× slower) while it has power (300 kW) and cryo cells inside. Cells are charged only on Aquilo and thaw within an hour. On Aquilo the vault is cold for free.
gcs-cryo-vault-passive-provider=__ENTITY__gcs-cryo-vault__ that offers its contents to the logistic network. Same cooling rules as the cryo vault.
gcs-cryo-vault-requester=__ENTITY__gcs-cryo-vault__ that requests items from the logistic network. Same cooling rules as the cryo vault.
gcs-cryo-vault-buffer=__ENTITY__gcs-cryo-vault__ that buffers items for the logistic network. Same cooling rules as the cryo vault.
gcs-refrigerated-wagon=Slows spoilage of its cargo while its equipment grid can supply 150 kW. Put a generator or batteries in the grid.
gcs-cryo-encapsulator=Freezes water into ice and seals perishables into ice blocks that keep much longer. Accepts no modules or beacons.

[item-name]
gcs-cryo-cell=Cryo cell
gcs-empty-cryo-cell=Empty cryo cell
gcs-frozen=Frozen __1__

[item-description]
gcs-cryo-cell=Frozen coolant for cryo vaults: put it inside the vault. Charged only on Aquilo, thaws into an empty cell within an hour. A partly thawed cell cools for less time.
gcs-empty-cryo-cell=Recharge it on Aquilo.
gcs-frozen=__1__ × __2__ sealed in ice. Keeps much longer than fresh; thaw it in a cryo-encapsulator.

[recipe-name]
gcs-freeze=Freeze __1__
gcs-thaw=Thaw __1__
gcs-freeze-water=Freeze water

[technology-name]
gcs-cold-chamber=Cold chain
gcs-cryo-vault=Cryogenic storage
gcs-cryo-encapsulation=Cryo-encapsulation

[technology-description]
gcs-cold-chamber=A powered, water-cooled chamber that slows spoilage of what is stored inside.
gcs-cryo-vault=Deep-cold vaults, logistic vaults and a refrigerated wagon.
gcs-cryo-encapsulation=Seal perishables in ice to ship them across the solar system.

[equipment-grid-name]
gcs-wagon-grid=Refrigeration power

